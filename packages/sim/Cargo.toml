[package]
name = "ipe-sim"
version = "0.1.0"
edition = "2021"
description = "Hourly solar, battery and household energy simulation for installer proposals"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
